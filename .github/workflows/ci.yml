name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Required check on main: keep the job name `test` in sync with branch protection.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Unit tests
        run: npm test

      - name: Build the extension
        run: npm run build

      - name: Check the extension package
        run: |
          node -e "JSON.parse(require('fs').readFileSync('manifest.json', 'utf8'))"
          for f in dist/content.js dist/page.js dist/options.js dist/popup.js; do
            test -s "$f" || { echo "::error::missing build output $f"; exit 1; }
          done
          ls dist/katex/fonts/*.woff2 > /dev/null
